interface:
  display_name: "1688源头厂家筛选询价助手"
  short_description: "用开源browser-use控制用户已登录的1688网页筛选源头厂家，默认问7-9家并只导出采购表截图里的列。"
  default_prompt: "请用开源 browser-use 帮我找这个产品的1688源头厂家并逐家询价，默认问7-9家。我会提供图片、关键词、1688链接、产品对标链接或当前页面；你先从搜索结果建候选池，然后直接按默认话术做发送轮，不要先问我确认话术：一家一家打开客服发送询价，复用一个聊天页，不要每家都开新窗口；每家都先点输入框上方的商品卡片/链接发送按钮，再发询价，发出后标待回复并继续下一家。之后再做回复收集轮，统一回到消息页看真实客服回复；对方只说在、有货、稍等、好的时要继续追问报价、起订量、交期、样品费和打样货期；对方要微信/电话/私发时请礼貌要求直接在1688发；需要产品规格、数量、颜色等用户决策时直接在Codex里问我。不能只筛选就导出最终表，页面已有信息不能冒充客服回复，Excel只保留我截图里的采购表列。"
